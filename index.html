    <!-- Structured Data -->
    <script type="application/ld+json">

      "@context": "https://schema.org",
      "@type": "LocalBusiness",
      "name": "Harmony Rides Transportation LLC",

      },

      "serviceType": "Non-Emergency Medical Transportation",
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Transport Services",
        "itemListElement": [
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Ambulatory Transport" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Wheelchair Transport" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Stretcher Transport" } },

      }
    }
